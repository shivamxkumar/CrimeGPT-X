  <text x="677" y="570" text-anchor="middle" fill="#506480" font-size="9">Document QA</text>

  <rect x="780" y="508" width="155" height="65" rx="8" fill="#0d1826" stroke="rgba(0,230,118,0.4)" stroke-width="1.5"/>
