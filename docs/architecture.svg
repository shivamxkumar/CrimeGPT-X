<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" style="background:#060d1a;font-family:Inter,sans-serif;">
  <!-- Background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(26,108,246,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#e8f0fe" font-size="20" font-weight="800" letter-spacing="-0.5">CrimeGPT — System Architecture</text>
