  <text x="497" y="545" text-anchor="middle" fill="#8aa3c8" font-size="10">Multi-language OCR</text>
  <text x="497" y="558" text-anchor="middle" fill="#506480" font-size="9">English · Hindi · Gujarati</text>
  <text x="497" y="570" text-anchor="middle" fill="#506480" font-size="9">FIR Document Parsing</text>

  <rect x="600" y="508" width="155" height="65" rx="8" fill="#0d1826" stroke="rgba(255,167,38,0.4)" stroke-width="1.5"/>
