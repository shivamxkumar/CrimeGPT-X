  <text x="170" y="127" text-anchor="middle" fill="#e8f0fe" font-size="12" font-weight="600">Browser / PWA</text>
  <text x="170" y="142" text-anchor="middle" fill="#8aa3c8" font-size="10">Next.js 14 · TypeScript</text>
  <text x="170" y="155" text-anchor="middle" fill="#506480" font-size="9">TailwindCSS · Recharts</text>

  <rect x="270" y="105" width="140" height="52" rx="8" fill="#0d1826" stroke="rgba(26,108,246,0.4)" stroke-width="1.5"/>
  <text x="340" y="127" text-anchor="middle" fill="#e8f0fe" font-size="12" font-weight="600">Mobile App</text>
  <text x="340" y="142" text-anchor="middle" fill="#8aa3c8" font-size="10">React Native (future)</text>
  <text x="340" y="155" text-anchor="middle" fill="#506480" font-size="9">iOS · Android</text>

  <rect x="440" y="105" width="140" height="52" rx="8" fill="#0d1826" stroke="rgba(0,212,255,0.4)" stroke-width="1.5"/>
